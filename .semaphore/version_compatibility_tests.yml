# Version Compatibility Tests Pipeline
# Runs weekly (service.yml): the Java client x server matrix, split over parallel jobs, and the
# topic-based routing (TBM, two clusters) suite in a job of its own (its own gateway and
# clusters). Each job pushes its results as workflow artifacts; the Report block merges them per
# suite, uploads to S3 and posts to Slack (ci-report.sh), and fails the pipeline on test failures.

version: v1.0
name: version-compatibility-tests
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

execution_time_limit:
  hours: 4

global_job_config:
  prologue:
    commands:
      - checkout
      - . vault-setup
      - . vault-sem-get-secret v1/ci/kv/cpc-gateway/slack-webhook-tests-notifications
      - . assume-iam-role arn:aws:iam::523370736235:role/root-account-access
      - export RESULTS_TIMESTAMP=$(date +%Y-%m-%d-%H-%M-%S)
      - export S3_BUCKET="gateway-results"
      - export S3_FOLDER="version-testing-results"
      - export GW_VERSION="${GATEWAY_VERSION:-1.0.0}"
      - export RESULTS_S3_PATH="s3://${S3_BUCKET}/${S3_FOLDER}/${GW_VERSION}/${RESULTS_TIMESTAMP}"
      - echo "Test results will be uploaded to - ${RESULTS_S3_PATH}"
      - sem-version python 3.12

blocks:
  - name: Version Compatibility Tests
    dependencies: []
    task:
      prologue:
        commands:
          - cd gateway-version-compatibility-test-tool
          - ./version-compatibility.sh --setup-env
      jobs:
        # The client x server matrix (~3 min per combination) in parallel slices.
        - name: Java Clients
          parallelism: 3
          commands:
            # A failure here is reported (and fails the pipeline) in the Report block.
            - |
              if [ -n "${KAFKA_SERVER_VERSION}" ] && [ -n "${KAFKA_CLIENT_VERSION}" ]; then
                if [ "${SEMAPHORE_JOB_INDEX}" = 1 ]; then
                  echo "Running single test for Gateway ${GW_VERSION} with Kafka Broker ${KAFKA_SERVER_VERSION} and Client ${KAFKA_CLIENT_VERSION}"
                  ./version-compatibility.sh --single "${KAFKA_CLIENT_VERSION}" "${KAFKA_SERVER_VERSION}" || true
                fi
              else
                SHARD="${SEMAPHORE_JOB_INDEX}/${SEMAPHORE_JOB_COUNT}" ./version-compatibility.sh --run || true
              fi
            - ./ci-push-results.sh standard
        - name: Topic-Based Routing (two clusters)
          commands:
            - |
              if [ -n "${KAFKA_SERVER_VERSION}" ] && [ -n "${KAFKA_CLIENT_VERSION}" ]; then
                ./version-compatibility.sh --tbm-single "${KAFKA_CLIENT_VERSION}" "${KAFKA_SERVER_VERSION}" "${KAFKA_SERVER_VERSION}" || true
              else
                ./version-compatibility.sh --tbm-run || true
              fi
            - ./ci-push-results.sh tbm
      epilogue:
        always:
          commands:
            - echo "Cleaning up Docker containers and images..."
            - docker compose -f docker-compose.yml down -v || true
            - docker compose -f docker-compose-kraft.yml down -v || true
            - docker compose -f docker-compose-tbm.yml down -v || true
            - docker system prune -f || true

  - name: Report
    dependencies: ["Version Compatibility Tests"]
    task:
      prologue:
        commands:
          - cd gateway-version-compatibility-test-tool
      jobs:
        - name: Report Results
          commands:
            - rc=0
            - ./ci-report.sh standard "Gateway Version Compatibility Tests" "${S3_FOLDER}" || rc=1
            - ./ci-report.sh tbm "Gateway TBM Compatibility Tests" "${S3_FOLDER}-tbm" || rc=1
            - exit $rc
