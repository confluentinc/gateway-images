# Topic-based routing (TBM): one dynamic gateway route over two Kafka clusters, for
# DynamicRoutingTest (version-compatibility.sh --tbm-run / --tbm-single).
#
#   kafka-server    cluster A (${KAFKA_SERVER_VERSION}): tbm-a-* topics, and the coordination
#                   cluster (consumer groups, producer ids)
#   kafka-server-b  cluster B (${KAFKA_SERVER_B_VERSION}): tbm-b-* topics
#
# Both clusters run KRaft at every version (CP 7.4+ supports it), on cp-kafka: single-broker,
# PLAINTEXT, no Confluent-only features to configure. Auto topic creation is off, so a
# mis-routed request can't create a topic on the wrong cluster.
#
# Dynamic routes use the host (SNI) broker strategy, so clients connect over TLS to dotted
# names (the JDK sends no SNI for a single-label host): gateway.tbm.test for bootstrap and
# broker<id>.tbm.test per broker, all network aliases of the gateway. The router advertises
# virtual broker ids (binding index + 2 x broker id): 0-3 for the two clusters' ids 0-1.

x-broker: &broker
  volumes:
    - ./ssl:/etc/kafka/secrets
  healthcheck:
    test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
    interval: 10s
    timeout: 10s
    retries: 5
    start_period: 60s

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: 'broker,controller'
  KAFKA_NODE_ID: 1
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  # Single broker
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  KAFKA_DEFAULT_REPLICATION_FACTOR: 1
  KAFKA_MIN_INSYNC_REPLICAS: 1

services:
  kafka-server:
    <<: *broker
    image: confluentinc/cp-kafka:${KAFKA_SERVER_VERSION}
    environment:
      <<: *broker-env
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-server:9093'
      CLUSTER_ID: 'MkUtXwzBR9mJHj3b2pXGgYQ'

  kafka-server-b:
    <<: *broker
    image: confluentinc/cp-kafka:${KAFKA_SERVER_B_VERSION}
    environment:
      <<: *broker-env
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-server-b:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-server-b:9093'
      CLUSTER_ID: 'Tbm2XwzBR9mJHj3b2pXGgYQ'

  gateway:
    image: ${DOCKER_REGISTRY:-}confluentinc/cpc-gateway:latest
    depends_on:
      kafka-server:
        condition: service_healthy
      kafka-server-b:
        condition: service_healthy
    ports:
      - "19400:19400"
      - "9190:9190"
    volumes:
      - ./ssl:/etc/gateway/secrets
    networks:
      default:
        aliases:
          - gateway.tbm.test
          - broker0.tbm.test
          - broker1.tbm.test
          - broker2.tbm.test
          - broker3.tbm.test
    environment:
      GATEWAY_CONFIG: |
        gateway:
          name: "vct-tbm-gateway"
          streamingDomains:
            - name: "cluster-a"
              kafkaCluster:
                name: "cluster-a"
                bootstrapServers:
                  - endpoint: "kafka-server:9092"
                    id: plaintext
                nodeIdRanges:
                  - name: "default"
                    start: 0
                    end: 1
            - name: "cluster-b"
              kafkaCluster:
                name: "cluster-b"
                bootstrapServers:
                  - endpoint: "kafka-server-b:9092"
                    id: plaintext
                nodeIdRanges:
                  - name: "default"
                    start: 0
                    end: 1
          routes:
            - name: "vct-tbm-route-ssl"
              endpoint: "gateway.tbm.test:19400"
              mode: DYNAMIC
              streamingDomains:
                - name: "cluster-a"
                  bootstrapServerId: plaintext
                - name: "cluster-b"
                  bootstrapServerId: plaintext
              brokerIdentificationStrategy:
                type: host
                pattern: "broker$(nodeId).tbm.test"
              security:
                ssl:
                  truststore:
                    location: /etc/gateway/secrets/kafka.truststore.jks
                    password:
                      file: /etc/gateway/secrets/truststore_creds
                  keystore:
                    location: /etc/gateway/secrets/kafka.keystore.jks
                    password:
                      file: /etc/gateway/secrets/truststore_creds
                  clientAuth: none
              rules:
                routing:
                  coordination:
                    group: "cluster-a"
                  conditions:
                    - streamingDomain: "cluster-a"
                      topicPatterns: ["tbm-a-.*"]
                    - streamingDomain: "cluster-b"
                      topicPatterns: ["tbm-b-.*"]
                  default: "cluster-a"
          admin:
            endpoints:
              metrics: true
          advanced:
            useIoUring: false

  kafka-client-test:
    build:
      context: .
      dockerfile: Dockerfile.kafka-maven
      args:
        KAFKA_VERSION: ${KAFKA_CLIENT_VERSION}
    depends_on:
      gateway:
        condition: service_started
    container_name: kafka-client-test
    volumes:
      - ./ssl:/etc/kafka/secrets
    command: sleep infinity
